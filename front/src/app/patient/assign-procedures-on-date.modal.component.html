<form name="form" #f="ngForm" novalidate>
    <div class="form-group" [ngClass]="{ 'has-error': f.submitted && !date.valid }">
        <div class="row mt-2">
            <div class="col-auto">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <div class="input-group-text">Дата</div>
                    </div>
                    <input type="date" class="form-control" name="date" [(ngModel)]="data.date" #date="ngModel"
                    required />
                </div>
                <div *ngIf="f.submitted && !date.valid" class="help-block text-danger">Поле обов`язкове</div>
            </div>
            <div class="col-auto ml-2">
                <div class="input-group">
                    <div class="input-group-prepend">
                        <div class="input-group-text">Час</div>
                        <select class="form-control" name="appointed" [(ngModel)]="data.appointed"
                            #appointed="ngModel" required>
                          <option [ngValue]="800">08:00</option>
                          <option [ngValue]="830">08:30</option>
                          <option [ngValue]="900">09:00</option>
                          <option [ngValue]="930">09:30</option>
                          <option [ngValue]="1000">10:00</option>
                          <option [ngValue]="1030">10:30</option>
                          <option [ngValue]="1100">11:00</option>
                          <option [ngValue]="1130">11:30</option>
                          <option [ngValue]="1200">12:00</option>
                          <option [ngValue]="1230">12:30</option>
                          <option [ngValue]="1300">13:00</option>
                          <option [ngValue]="1330">13:30</option>
                          <option [ngValue]="1400">14:00</option>
                          <option [ngValue]="1430">14:30</option>
                          <option [ngValue]="1500">15:00</option>
                          <option [ngValue]="1530">15:30</option>
                          <option [ngValue]="1600">16:00</option>
                        </select>
                    </div>
                </div>
            </div>
            <div *ngIf="f.submitted && !appointed.valid" class="help-block text-danger">Поле обов`язкове</div>
        </div>
    </div>
</form>
